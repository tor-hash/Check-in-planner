name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENVIRONMENT: staging
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1,http://localhost
      DATABASE_URL: sqlite:///db.sqlite3
      GOOGLE_OAUTH2_KEY: ci-google-key
      GOOGLE_OAUTH2_SECRET: ci-google-secret
      GOOGLE_WORKSPACE_DOMAIN: blackcapitaltechnology.com
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      DJANGO_SECURE_HSTS_PRELOAD: "False"
      USE_GOOGLE_SHEET_JOURNAL: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff>=0.6.0

      - name: Lint (ruff)
        run: ruff check backend

      - name: Django system check
        run: python backend/manage.py check

      - name: Migration check
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python backend/manage.py test apps.planner.tests apps.accounts.tests apps.onboarding.tests apps.feedback --verbosity=2

  # Deploy to Cloud Run on every push to main -- only after the backend
  # job above has passed. Authenticates to Google Cloud with Workload
  # Identity Federation (no JSON keys stored in GitHub) and runs the same
  # cloudbuild.yaml used for manual deploys. One-time GCP setup:
  # scripts/setup-github-deploy.sh
  deploy:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy (Cloud Build)
        run: |
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project "${{ vars.GCP_PROJECT_ID }}"
