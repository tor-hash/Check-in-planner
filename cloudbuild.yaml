steps:
  # Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'gcr.io/$PROJECT_ID/checkin-planner', '.']

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/checkin-planner']

  # Deploy to Cloud Run (keeps existing env vars / Cloud SQL config)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - checkin-planner
      - --image=gcr.io/$PROJECT_ID/checkin-planner
      - --region=europe-north1

  # Keep migrate-job image in sync with the app image, then run it
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - migrate-job
      - --image=gcr.io/$PROJECT_ID/checkin-planner
      - --region=europe-north1

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - migrate-job
      - --region=europe-north1
      - --wait

  # Keep auto-booking-job's image in sync with the app image on every
  # deploy. Deliberately no "execute" step here — Cloud Scheduler
  # (auto-booking-job, weekly Mon 06:00 Europe/Copenhagen) owns triggering
  # this one, so we only need the image kept current, not run on deploy.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - auto-booking-job
      - --image=gcr.io/$PROJECT_ID/checkin-planner
      - --region=europe-north1

  # Keep decline-sync-job's image in sync with the app image on every
  # deploy. Same reasoning as auto-booking-job: Cloud Scheduler
  # (decline-sync-job, every 4 hours) owns triggering it, so we only
  # keep the image current here rather than executing it on deploy.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - decline-sync-job
      - --image=gcr.io/$PROJECT_ID/checkin-planner
      - --region=europe-north1

images:
  - 'gcr.io/$PROJECT_ID/checkin-planner'
